name: Build release

# Compile BG3SE (Windows/MSVC only, no upstream CI exists — see
# https://github.com/ElwinghL/bg3se, fork of Norbyte/bg3se) so patches on
# this fork can be validated/released without a local Windows/VS2022 setup.
#
# KNOWN RISK (unverified — no local Windows machine to test against):
# BG3Extender.vcxproj pins PlatformToolset=v145, which is unusually recent
# (VS2022 GA typically ships v143). If the windows-latest runner's VS2022
# install doesn't have v145 components, the msbuild step below will fail
# with an MSB8020-style "platform toolset not found" error. If that
# happens, either install the matching VS2022 workload via a setup step,
# or retarget the .vcxproj's PlatformToolset to a version confirmed
# present on the runner (check `vswhere` / `msbuild -version` output in
# the failed run's logs first, don't guess).

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python (needed by generate-property-maps.bat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up MSVC x64 dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache external dependencies
        uses: actions/cache@v4
        with:
          path: External
          key: bg3se-externals-${{ hashFiles('pull-externals.bat') }}

      - name: Pull external dependencies
        shell: cmd
        run: pull-externals.bat

      - name: Generate property maps
        shell: cmd
        run: generate-property-maps.bat

      - name: Generate protobuf sources
        shell: cmd
        run: generate-proto.bat

      - name: Build solution (Release, x64)
        shell: cmd
        run: msbuild BG3Tools.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /consoleloggerparameters:summary

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg3se-release-${{ github.sha }}
          # Confirmed from a real run's link step: BG3Extender.vcxproj's
          # "Release" solution configuration maps to a project configuration
          # named "Game Release" (output dir "x64\Game Release\"), not a
          # plain "Release" folder — glob broadened to match.
          path: |
            **/x64/*Release*/*.dll
            **/x64/*Release*/*.pdb
            **/x64/*Release*/*.exe
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/x64/Release/*.dll
            **/x64/Release/*.exe
